AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Startup Radar — daily launch + review digest

Parameters:
  DigestTo: { Type: String }
  DigestFrom: { Type: String }
  AnthropicApiKey: { Type: String, NoEcho: true }
  ProductHuntToken: { Type: String, NoEcho: true, Default: "" }

Resources:
  RadarFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Fixed name so RadarLogGroup below can own /aws/lambda/<name> (with retention)
      FunctionName: !Sub "${AWS::StackName}-digest"
      CodeUri: dist/
      Handler: handler.handler
      Runtime: nodejs22.x
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DIGEST_TO: !Ref DigestTo
          DIGEST_FROM: !Ref DigestFrom
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          PRODUCT_HUNT_TOKEN: !Ref ProductHuntToken
      # No automatic retries: a retry re-runs the Claude call and could email the digest twice
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Policies:
        - SESCrudPolicy: { IdentityName: !Ref DigestFrom }
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            # 7:00 AM Eastern, every day
            ScheduleExpression: "cron(0 7 * * ? *)"
            ScheduleExpressionTimezone: America/New_York

  RadarLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-digest"
      RetentionInDays: 30
